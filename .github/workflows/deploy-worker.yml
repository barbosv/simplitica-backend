name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-${{ inputs.target }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SIMPLI_INVOICE_APP_APPLE_ID: ${{ vars.SIMPLI_INVOICE_APP_APPLE_ID }}
      SIMPLI_INVOICE_BUNDLE_ID: ${{ vars.SIMPLI_INVOICE_BUNDLE_ID }}
      STRIPE_MODE: ${{ vars.STRIPE_MODE }}
      STRIPE_PLATFORM_COUNTRY: ${{ vars.STRIPE_PLATFORM_COUNTRY }}
      STRIPE_CONNECT_RETURN_URL: ${{ vars.STRIPE_CONNECT_RETURN_URL }}
      STRIPE_CONNECT_REFRESH_URL: ${{ vars.STRIPE_CONNECT_REFRESH_URL }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      SIMPLILIST_RATE_LIMIT_PER_MINUTE: ${{ vars.SIMPLILIST_RATE_LIMIT_PER_MINUTE }}
      PUBLIX_DEALS_CACHE_MS: ${{ vars.PUBLIX_DEALS_CACHE_MS }}
      PUBLIX_DEALS_FIXTURE: ${{ vars.PUBLIX_DEALS_FIXTURE }}
      RETAILERAPI_BASE_URL: ${{ vars.RETAILERAPI_BASE_URL }}
      HOME_DEPOT_DATA_API_BASE_URL: ${{ vars.HOME_DEPOT_DATA_API_BASE_URL }}
      HOME_DEPOT_DATA_API_HOST: ${{ vars.HOME_DEPOT_DATA_API_HOST }}
      WORKER_SMOKE_URL: ${{ vars.WORKER_SMOKE_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate deployment inputs
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = production ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Production deployments require main'; exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          case "$WORKER_SMOKE_URL" in https://*) ;; *) echo 'Set an HTTPS WORKER_SMOKE_URL'; exit 1;; esac
          node scripts/prepare-worker-config.mjs "$TARGET" .wrangler/deploy.json
      - name: Check required runtime secrets
        run: |
          npx wrangler secret list --config .wrangler/deploy.json > .wrangler/secrets.json
          node scripts/check-worker-secrets.mjs .wrangler/secrets.json
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler/deploy.json
      - name: Deploy Worker
        run: npx wrangler deploy --config .wrangler/deploy.json
      - name: Check deployed Worker
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 "${WORKER_SMOKE_URL%/}/health"
          curl --fail --silent --show-error --retry 3 --max-time 30 "${WORKER_SMOKE_URL%/}/health/ready"
